name: CI
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
  # Stages B-D each run part of the suite and keep their coverage data for the G5 gate below.
  # tests/unit/test_ci_split.py checks that every test file runs in exactly one of them.
  unit:
    needs: static
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: .coverage.unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest tests/unit --cov=app --cov-report=
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-data-unit
          path: .coverage.unit
          include-hidden-files: true
  # Stage C: AC-01..AC-07 and the OpenAPI contract check.
  acceptance:
    needs: unit
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: .coverage.acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest tests/acceptance tests/contract --cov=app --cov-report=
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-data-acceptance
          path: .coverage.acceptance
          include-hidden-files: true
  # Stage D: the tester's checks and the autograder harness against the app in-process.
  tester:
    needs: unit
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: .coverage.tester
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest tests/tester tests/test_harness.py --cov=app --cov-report=
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-data-tester
          path: .coverage.tester
          include-hidden-files: true
  # G5 (docs/goals.md) is coverage of app/ by the whole suite: combine the three jobs' data.
  coverage:
    needs: [unit, acceptance, tester]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - run: uv run coverage combine
      - run: uv run coverage xml
      - run: uv run coverage report --fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
  # Stage E: both images build, tagged with the commit, and the system image reports that commit.
  docker-build:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} -t releasegate:${{ github.sha }} .
      - run: docker build -f tester/Dockerfile -t releasegate-tester:${{ github.sha }} .
      - run: >-
          docker run --rm releasegate:${{ github.sha }} /srv/.venv/bin/python -c
          "from app.config import Settings; c = Settings.from_env().commit;
          assert c == '${{ github.sha }}', c"
  # Stage F: the compose stack with test endpoints on. Smoke test, the tester (from the host, from
  # the tester container and the system's own /test/run), then a restart must keep the release,
  # components, incident, computed deadlines and audit entries (AC-10 for REQ-01/02/05/06).
  container-smoke:
    needs: [docker-build, acceptance, tester]
    runs-on: ubuntu-latest
    env:
      ENABLE_TEST_ENDPOINTS: "true"
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: docker compose up -d --build
      - name: Wait for /health on both services (60 s)
        run: |
          for i in $(seq 1 60); do
            curl -fsS localhost:8080/health && curl -fsS localhost:8081/health && exit 0
            sleep 1
          done
          exit 1
      - run: curl -fsS localhost:8080/health | grep -q "\"commit\":\"$GIT_SHA\""
      - run: bash scripts/smoke.sh localhost:8080
      - run: uv run python scripts/container_smoke.py tester http://localhost:8080
      - name: Tester container and system self-test (/test/run) pass
        run: |
          for port in 8081 8080; do
            curl -fsS -X POST localhost:$port/test/run | tee run.json
            python3 -c "import json; r = json.load(open('run.json')); assert r['result'] == 'pass', r"
          done
      - run: uv run python scripts/container_smoke.py seed http://localhost:8080 state.json
      - run: docker compose restart api
      - name: Wait for /health after the restart (60 s)
        run: |
          for i in $(seq 1 60); do curl -fsS localhost:8080/health && exit 0; sleep 1; done
          exit 1
      - run: uv run python scripts/container_smoke.py verify http://localhost:8080 state.json
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
