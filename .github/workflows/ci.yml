name: CI
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
  unit:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest tests/unit
  # G5 (docs/goals.md) is coverage of app/ by the whole suite, so the gate runs on all tests
  # until stages C and D split the acceptance, contract and tester tests into their own jobs.
  test:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
  # Stage E: both images build, tagged with the commit, and the system image reports that commit.
  docker-build:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} -t releasegate:${{ github.sha }} .
      - run: docker build -f tester/Dockerfile -t releasegate-tester:${{ github.sha }} .
      - run: >-
          docker run --rm releasegate:${{ github.sha }} /srv/.venv/bin/python -c
          "from app.config import Settings; c = Settings.from_env().commit;
          assert c == '${{ github.sha }}', c"
