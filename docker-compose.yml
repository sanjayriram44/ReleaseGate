services:
  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DB_PATH: /data/releasegate.db
      # Only enable on the evaluation deployment (synthetic data only).
      ENABLE_TEST_ENDPOINTS: ${ENABLE_TEST_ENDPOINTS:-false}
    volumes:
      - releasegate-data:/data
      # Nightly backups (deploy/backup.sh), kept outside the data volume.
      - ${BACKUP_DIR:-./backups}:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Runs AC-01..AC-07 against any system base URL; stateless (reports kept in memory).
  tester:
    build:
      context: .
      dockerfile: tester/Dockerfile
    ports:
      - "${TESTER_PORT:-8081}:8081"
    environment:
      # /test/setup without a target_url tests our own system. The deploy sets the public URL,
      # so reports name the system the grader registered (the VM reaches its own public IP).
      TESTER_DEFAULT_TARGET: ${TESTER_DEFAULT_TARGET:-http://api:8080}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8081/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  releasegate-data:
