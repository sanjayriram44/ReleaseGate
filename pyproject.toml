[project]
name = "releasegate"
version = "0.1.0"
description = "ReleaseGate: release/SBOM registry and CRA deadline tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "cyclonedx-python-lib[json-validation]>=11.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
    "types-pyyaml",
    "types-jsonschema",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
